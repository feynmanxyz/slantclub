<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Happy Sudoku 🌈</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Bubblegum+Sans&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }
        
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 0%, transparent 50%);
            /* 移除持续动画以降低CPU占用 */
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1400px;
            position: relative;
            z-index: 1;
            margin: 20px auto;
        }
        
        h1 {
            font-family: 'Bubblegum Sans', cursive;
            color: #667eea;
            text-align: center;
            font-size: 3em;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0px #ffd93d;
            letter-spacing: 2px;
        }
        
        .settings {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .setting-group {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .setting-group label {
            display: block;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        .setting-group select {
            font-family: 'Fredoka', sans-serif;
            padding: 10px 20px;
            border: 3px solid #fdcb6e;
            border-radius: 15px;
            font-size: 1em;
            font-weight: 600;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .setting-group select:hover {
            transform: scale(1.05);
            border-color: #f39c12;
        }
        
        .btn {
            font-family: 'Fredoka', sans-serif;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: 700;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-start {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
        }
        
        .btn-start:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(238,90,111,0.4);
        }
        
        .btn-check {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: white;
        }
        
        .btn-check:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(78,205,196,0.4);
        }
        
        .btn-close {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            color: white;
            margin-top: 20px;
        }
        
        .btn-close:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(127,140,141,0.4);
        }
        
        .btn-show-answer {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            margin-top: 20px;
            margin-left: 20px;
        }
        
        .btn-show-answer:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(230,126,34,0.4);
        }
        
        .game-area {
            display: none;
            justify-content: center;
            align-items: flex-start;
            margin-top: 30px;
            margin-bottom: 30px;
            position: relative;
        }
        
        .game-area.active {
            display: flex;
        }
        
        .game-wrapper {
            display: inline-block;
            position: relative;
            margin: 0 auto;
        }
        
        .sudoku-container {
            display: inline-block;
            background: rgba(248, 249, 250, 0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        .sudoku-grid {
            display: inline-grid;
            gap: 2px;
            background: #34495e;
            padding: 3px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin: 0 auto;
        }
        
        .cell {
            width: 50px;
            height: 50px;
            background: #e8e8e8;
            border: 2px solid #bdc3c7;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            font-weight: 700;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 5px;
            /* GPU加速优化 */
            will-change: transform, background-color;
            transform: translateZ(0);
        }
        
        .cell:hover:not(.fixed):not(.error) {
            background: #fff9e6;
            transform: scale(1.05);
            will-change: transform;
        }
        
        .cell.fixed {
            background: #bdc3c7;
            color: #2c3e50;
            cursor: default;
            font-weight: 900;
        }
        
        .cell.selected {
            background: #ffe66d;
            border-color: #ffb347;
            transform: scale(1.05);
        }
        
        .cell.error {
            background: #ff6b6b;
            color: white;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .number-pad {
            display: flex;
            position: absolute;
        }
        
        .number-pad-right {
            flex-direction: column;
            gap: 2px;
            top: 0;
            left: calc(100% + 8px);
        }
        
        .number-pad-bottom {
            flex-direction: row;
            gap: 2px;
            top: calc(100% + 8px);
            left: 0;
        }
        
        .number-btn {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            flex-shrink: 0;
            /* GPU加速优化 */
            will-change: transform;
            transform: translateZ(0);
        }
        
        .number-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(9,132,227,0.4);
        }
        
        .number-btn:active {
            transform: scale(0.95);
        }
        
        .number-btn.clear {
            background: linear-gradient(135deg, #fab1a0 0%, #e17055 100%);
        }
        
        .controls {
            text-align: center;
            margin-top: 30px;
        }
        
        #gameControls {
            margin-top: 80px;
        }
        
        /* 庆祝动画 */
        .celebration {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
        
        .celebration.active {
            display: block;
        }
        
        .celebration-icon {
            position: absolute;
            font-size: 3em;
            animation: celebrate 3s ease-out forwards;
            /* GPU加速优化 */
            will-change: transform, opacity;
            transform: translateZ(0);
        }
        
        @keyframes celebrate {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg) scale(1.5);
                opacity: 0;
            }
        }
        
        .message {
            text-align: center;
            margin: 20px 0;
            font-size: 1.3em;
            font-weight: 700;
            color: #2d3436;
            min-height: 30px;
        }
        
        .message.success {
            color: #00b894;
            animation: pulse 0.5s ease-in-out;
        }
        
        .message.error {
            color: #d63031;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .cell {
                width: 35px;
                height: 35px;
                font-size: 1.2em;
            }
            
            .number-pad-right {
                position: static;
                flex-direction: row;
                flex-wrap: wrap;
                margin-top: 15px;
                justify-content: center;
            }
            
            .number-pad-bottom {
                display: none;
            }
            
            .game-area {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Happy Sudoku 🌈</h1>
        
        <div class="settings">
            <div class="setting-group">
                <label for="gridSize">🎯 Grid Size</label>
                <select id="gridSize">
                    <option value="3">3×3 (Easy)</option>
                    <option value="4">4×4</option>
                    <option value="5">5×5</option>
                    <option value="6">6×6</option>
                    <option value="7">7×7</option>
                    <option value="8">8×8</option>
                    <option value="9" selected>9×9 (Classic)</option>
                    <option value="10">10×10</option>
                    <option value="12">12×12</option>
                    <option value="15">15×15</option>
                    <option value="16">16×16</option>
                    <option value="20">20×20 (Extreme)</option>
                </select>
            </div>
            
            <div class="setting-group">
                <label for="difficulty">⭐ Difficulty</label>
                <select id="difficulty">
                    <option value="easy">Easy 😊</option>
                    <option value="medium" selected>Medium 🤔</option>
                    <option value="hard">Hard 😤</option>
                </select>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-start" onclick="startNewGame()">🎉 Start Game 🎉</button>
        </div>
        
        <div class="message" id="message"></div>
        
        <div class="game-area" id="gameArea">
            <div class="sudoku-container">
                <div class="game-wrapper" id="gameWrapper">
                    <div class="sudoku-grid" id="sudokuGrid"></div>
                    <div class="number-pad number-pad-right" id="numberPadRight"></div>
                    <div class="number-pad number-pad-bottom" id="numberPadBottom"></div>
                </div>
            </div>
        </div>
        
        <div class="controls" id="gameControls" style="display: none;">
            <button class="btn btn-check" onclick="checkSolution()">✅ Check Answer</button>
            <br>
            <button class="btn btn-close" onclick="closePage()">🚪 Close Page</button>
            <button class="btn btn-show-answer" onclick="showAnswer()">💡 Show Answer</button>
        </div>
    </div>
    
    <div class="celebration" id="celebration"></div>
    
    <script>
        let gridSize = 9;
        let difficulty = 'medium';
        let solution = [];
        let puzzle = [];
        let userGrid = [];
        let selectedCell = null;
        let gameEnded = false;
        
        const celebrationIcons = ['🎉', '🎊', '⭐', '🌟', '✨', '🎈', '🎁', '🏆', '👏', '🎯', '💫', '🌈', '🦄', '🎪'];
        
        function startNewGame() {
            gridSize = parseInt(document.getElementById('gridSize').value);
            difficulty = document.getElementById('difficulty').value;
            gameEnded = false;
            
            generateSudoku();
            renderGrid();
            renderNumberPad();
            
            document.getElementById('gameArea').classList.add('active');
            document.getElementById('gameControls').style.display = 'block';
            document.getElementById('message').textContent = 'Go for it! You can do this! 💪';
        }
        
        function generateSudoku() {
            // 生成完整的数独解
            solution = createEmptyGrid();
            fillGrid(solution);
            
            // 创建谜题（移除一些数字）
            puzzle = JSON.parse(JSON.stringify(solution));
            userGrid = JSON.parse(JSON.stringify(solution));
            
            const cellsToRemove = getCellsToRemove();
            const positions = [];
            
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    positions.push([i, j]);
                }
            }
            
            // 随机打乱位置
            shuffleArray(positions);
            
            // 移除数字
            for (let i = 0; i < cellsToRemove && i < positions.length; i++) {
                const [row, col] = positions[i];
                puzzle[row][col] = 0;
                userGrid[row][col] = 0;
            }
        }
        
        function getCellsToRemove() {
            const totalCells = gridSize * gridSize;
            const difficultyRatios = {
                easy: 0.3,
                medium: 0.5,
                hard: 0.7
            };
            return Math.floor(totalCells * difficultyRatios[difficulty]);
        }
        
        function createEmptyGrid() {
            const grid = [];
            for (let i = 0; i < gridSize; i++) {
                grid[i] = [];
                for (let j = 0; j < gridSize; j++) {
                    grid[i][j] = 0;
                }
            }
            return grid;
        }
        
        function fillGrid(grid) {
            const numbers = [];
            for (let i = 1; i <= gridSize; i++) {
                numbers.push(i);
            }
            
            return fillGridRecursive(grid, 0, 0, numbers);
        }
        
        function fillGridRecursive(grid, row, col, numbers) {
            if (row === gridSize) {
                return true;
            }
            
            const nextRow = col === gridSize - 1 ? row + 1 : row;
            const nextCol = col === gridSize - 1 ? 0 : col + 1;
            
            const shuffled = [...numbers];
            shuffleArray(shuffled);
            
            for (let num of shuffled) {
                if (isValidPlacement(grid, row, col, num)) {
                    grid[row][col] = num;
                    
                    if (fillGridRecursive(grid, nextRow, nextCol, numbers)) {
                        return true;
                    }
                    
                    grid[row][col] = 0;
                }
            }
            
            return false;
        }
        
        function isValidPlacement(grid, row, col, num) {
            // 检查行
            for (let i = 0; i < gridSize; i++) {
                if (grid[row][i] === num) return false;
            }
            
            // 检查列
            for (let i = 0; i < gridSize; i++) {
                if (grid[i][col] === num) return false;
            }
            
            // 检查子网格
            const boxSize = Math.sqrt(gridSize);
            if (boxSize === Math.floor(boxSize)) {
                const boxRow = Math.floor(row / boxSize) * boxSize;
                const boxCol = Math.floor(col / boxSize) * boxSize;
                
                for (let i = 0; i < boxSize; i++) {
                    for (let j = 0; j < boxSize; j++) {
                        if (grid[boxRow + i][boxCol + j] === num) return false;
                    }
                }
            }
            
            return true;
        }
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        function renderGrid() {
            const grid = document.getElementById('sudokuGrid');
            grid.innerHTML = '';
            
            const boxSize = Math.sqrt(gridSize);
            const hasBox = boxSize === Math.floor(boxSize);
            
            grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            
            // 动态调整单元格大小
            const cellSize = Math.max(25, Math.min(50, 450 / gridSize));
            
            // 保存cellSize供renderNumberPad使用
            window.currentCellSize = cellSize;
            
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.width = cellSize + 'px';
                    cell.style.height = cellSize + 'px';
                    cell.style.fontSize = (cellSize * 0.5) + 'px';
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    
                    if (puzzle[i][j] !== 0) {
                        cell.textContent = puzzle[i][j];
                        cell.classList.add('fixed');
                    } else if (userGrid[i][j] !== 0) {
                        cell.textContent = userGrid[i][j];
                    }
                    
                    // 添加粗边框用于区分子网格
                    if (hasBox) {
                        if (i % boxSize === 0 && i !== 0) {
                            cell.style.borderTop = '3px solid #34495e';
                        }
                        if (j % boxSize === 0 && j !== 0) {
                            cell.style.borderLeft = '3px solid #34495e';
                        }
                    }
                    
                    cell.addEventListener('click', () => selectCell(i, j));
                    grid.appendChild(cell);
                }
            }
        }
        
        function renderNumberPad() {
            const padRight = document.getElementById('numberPadRight');
            const padBottom = document.getElementById('numberPadBottom');
            padRight.innerHTML = '';
            padBottom.innerHTML = '';
            
            // 获取格子大小
            const cellSize = window.currentCellSize || 50;
            // 按钮大小需要考虑间隙，使得 (btnSize * gridSize + gap * (gridSize-1)) = cellSize * gridSize + gap * (gridSize-1)
            // 简化：btnSize = cellSize
            const btnSize = cellSize;
            const fontSize = cellSize * 0.45;
            
            // 右侧按钮：显示1到gridSize的所有数字
            for (let i = 1; i <= gridSize; i++) {
                const btn = document.createElement('button');
                btn.className = 'number-btn';
                btn.textContent = i;
                btn.style.width = btnSize + 'px';
                btn.style.height = btnSize + 'px';
                btn.style.fontSize = fontSize + 'px';
                btn.addEventListener('click', () => placeNumber(i));
                padRight.appendChild(btn);
            }
            
            // 底部按钮：同样显示1到gridSize的所有数字
            for (let i = 1; i <= gridSize; i++) {
                const btn = document.createElement('button');
                btn.className = 'number-btn';
                btn.textContent = i;
                btn.style.width = btnSize + 'px';
                btn.style.height = btnSize + 'px';
                btn.style.fontSize = fontSize + 'px';
                btn.addEventListener('click', () => placeNumber(i));
                padBottom.appendChild(btn);
            }
            
            // 清除按钮放在右下角（底部的最后）
            const clearBtn = document.createElement('button');
            clearBtn.className = 'number-btn clear';
            clearBtn.textContent = '❌';
            clearBtn.style.width = btnSize + 'px';
            clearBtn.style.height = btnSize + 'px';
            clearBtn.style.fontSize = fontSize + 'px';
            clearBtn.addEventListener('click', () => placeNumber(0));
            padBottom.appendChild(clearBtn);
            
            // 调整sudoku-container的padding以容纳按钮
            const container = document.querySelector('.sudoku-container');
            const gridWidth = cellSize * gridSize + 2 * gridSize + 6; // 格子宽度 + 间隙 + padding
            const rightPadWidth = btnSize + 8; // 右侧按钮宽度 + 间距
            const bottomPadHeight = btnSize + 8; // 底部按钮高度 + 间距
            
            container.style.paddingRight = (rightPadWidth + 20) + 'px';
            container.style.paddingBottom = (bottomPadHeight + 20) + 'px';
        }
        
        function selectCell(row, col) {
            if (puzzle[row][col] !== 0) return;
            
            const cells = document.querySelectorAll('.cell');
            cells.forEach(c => c.classList.remove('selected'));
            
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            cell.classList.add('selected');
            
            selectedCell = { row, col };
        }
        
        function placeNumber(num) {
            if (gameEnded) {
                document.getElementById('message').textContent = 'Game ended! Please start a new game.';
                return;
            }
            
            if (!selectedCell) {
                document.getElementById('message').textContent = 'Please select a cell first!';
                return;
            }
            
            const { row, col } = selectedCell;
            if (puzzle[row][col] !== 0) return;
            
            userGrid[row][col] = num;
            
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            cell.textContent = num === 0 ? '' : num;
            cell.classList.remove('error');
            
            document.getElementById('message').textContent = '';
        }
        
        function checkSolution() {
            if (gameEnded) {
                document.getElementById('message').textContent = 'Game ended!';
                return;
            }
            
            let correct = true;
            let filled = true;
            
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => cell.classList.remove('error'));
            
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    if (userGrid[i][j] === 0) {
                        filled = false;
                    } else if (userGrid[i][j] !== solution[i][j]) {
                        correct = false;
                        const cell = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
                        if (cell && !cell.classList.contains('fixed')) {
                            cell.classList.add('error');
                        }
                    }
                }
            }
            
            const messageEl = document.getElementById('message');
            
            if (!filled) {
                messageEl.textContent = 'There are still empty cells! Keep going! 💪';
                messageEl.className = 'message';
            } else if (correct) {
                messageEl.textContent = '🎉 Awesome! You did it! 🎉';
                messageEl.className = 'message success';
                gameEnded = true;
                celebrate();
            } else {
                messageEl.textContent = 'Some answers are incorrect. Please check again! 🔍';
                messageEl.className = 'message error';
            }
        }
        
        function celebrate() {
            const celebration = document.getElementById('celebration');
            celebration.classList.add('active');
            celebration.innerHTML = '';
            
            // 减少图标数量从50到30，降低性能消耗
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const icon = document.createElement('div');
                    icon.className = 'celebration-icon';
                    icon.textContent = celebrationIcons[Math.floor(Math.random() * celebrationIcons.length)];
                    icon.style.left = Math.random() * 100 + '%';
                    icon.style.animationDelay = Math.random() * 0.5 + 's';
                    icon.style.animationDuration = (2 + Math.random() * 2) + 's';
                    celebration.appendChild(icon);
                }, i * 80);
            }
            
            // 清理DOM元素和移除active类
            setTimeout(() => {
                celebration.classList.remove('active');
                celebration.innerHTML = ''; // 清理DOM元素释放内存
            }, 5000);
        }
        
        function closePage() {
            if (confirm('Are you sure you want to close the page?')) {
                window.close();
                // If browser doesn't allow closing, show a message
                setTimeout(() => {
                    alert('Please close the browser tab manually');
                }, 100);
            }
        }
        
        function showAnswer() {
            if (confirm('Are you sure you want to show the answer? The game will end.')) {
                gameEnded = true;
                
                // Fill in all answers
                for (let i = 0; i < gridSize; i++) {
                    for (let j = 0; j < gridSize; j++) {
                        userGrid[i][j] = solution[i][j];
                        const cell = document.querySelector(`[data-row="${i}"][data-col="${j}"]`);
                        cell.textContent = solution[i][j];
                        cell.classList.remove('error');
                        
                        // Mark filled answers with a special color
                        if (puzzle[i][j] === 0) {
                            cell.style.color = '#e67e22';
                            cell.style.fontWeight = '600';
                        }
                    }
                }
                
                const messageEl = document.getElementById('message');
                messageEl.textContent = '💡 Answer revealed! Game ended.';
                messageEl.className = 'message';
            }
        }
    </script>
</body>
</html>
