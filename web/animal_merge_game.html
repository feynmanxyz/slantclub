
<style>

.leg-item{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:0.5px solid var(--color-border-tertiary);border-right:0.5px solid var(--color-border-tertiary)}
.leg-emoji{font-size:20px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}

.leg-name{font-size:11px;color:var(--color-text-primary)}
.leg-lv{font-size:10px;color:var(--color-text-secondary)}
</style>

<div id="root">
  <div style="position:relative">
    <div id="game-wrap">
      <div id="game-area">
        <div id="aim-line"></div>
        <canvas id="game-canvas"></canvas>
        <canvas id="fx-canvas"></canvas>
        <div id="overlay">
          <h2>🦁 动物合并</h2>
          <p>相同动物碰撞合并升级<br>堆满即结束</p>
          <button onclick="startGame()">开始游戏</button>
        </div>
      </div>
      <div id="sidebar">
        <div class="s-block"><div class="s-label">得分</div><div class="score-val" id="score">0</div></div>
        <div class="s-block"><div class="s-label">下一个</div><div class="next-box" id="next-ani">🐭</div></div>
        <div class="s-block">
          <div class="s-label">动物种类</div>
          <select id="ani-count">
            <option value="5">5种（简单）</option>
            <option value="7" selected>7种（普通）</option>
            <option value="9">9种（困难）</option>
            <option value="11">11种（地狱）</option>
          </select>
        </div>
        <div class="s-block">
          <div class="s-label">游戏区高度</div>
          <select id="game-height">
            <option value="350">矮（难）</option>
            <option value="450" selected>中</option>
            <option value="580">高（易）</option>
          </select>
        </div>
        <div class="s-block">
          <div class="s-label">护眼定时 <span id="eye-lbl" style="float:right;font-weight:500;color:var(--color-text-primary)">05:00</span></div>
          <select id="eye-setting">
            <option value="300" selected>5分钟</option>
            <option value="360">6分钟</option>
            <option value="420">7分钟</option>
            <option value="480">8分钟</option>
            <option value="540">9分钟</option>
            <option value="600">10分钟</option>
          </select>

  <div id="legend-wrap">
    <div id="legend-title">动物图鉴 — 从小到大</div>
    <div id="legend-grid"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
// 11种动物，体型从小到大排列
const ALL_ANI = [
  {emoji:'🐭', r:15, n:'老鼠'},
  {emoji:'🐰', r:20, n:'兔子'},
  {emoji:'🐸', r:25, n:'青蛙'},
  {emoji:'🐱', r:30, n:'猫咪'},
  {emoji:'🐶', r:35, n:'小狗'},
  {emoji:'🦊', r:40, n:'狐狸'},
  {emoji:'🐷', r:46, n:'猪猪'},
  {emoji:'🐮', r:52, n:'奶牛'},
  {emoji:'🐯', r:58, n:'老虎'},
  {emoji:'🦁', r:65, n:'狮子'},
  {emoji:'🐘', r:72, n:'大象'},
];

let engine,runner,world;
let bodies=[],score=0,anis=[];
let nextIdx=0,currentIdx=0;
let gameRunning=false,canDrop=true,dropX=150;
let gameOver=false,animFrame;
let mergeQueue=[],scheduledIds=new Set();
const COOLDOWN_MS=150,PROXIMITY_GAP=3;

// ── Audio ─────────────────────────────────────────────────────────────────────
let audioCtx=null;
function getAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function playMerge(level){
  try{
    const ac=getAC(),now=ac.currentTime;
    if(level<=2){
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);o.type='sine';
      const f=500+level*60;o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*1.45,now+.09);
      g.gain.setValueAtTime(.18,now);g.gain.exponentialRampToValueAtTime(.001,now+.2);
      o.start(now);o.stop(now+.2);
    } else if(level<=5){
      [1,1.5].forEach((m,i)=>{
        const o=ac.createOscillator(),g=ac.createGain();
        o.connect(g);g.connect(ac.destination);o.type='triangle';
        const f=(560+level*70)*m,t=now+i*.045;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.33);
        o.frequency.value=f;o.start(t);o.stop(t+.33);
      });
    } else if(level<=8){
      [1,1.26,1.5,2].forEach((m,i)=>{
        const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();
        o.connect(fl);fl.connect(g);g.connect(ac.destination);
        fl.type='lowpass';fl.frequency.value=2000;o.type='square';
        o.frequency.value=(360+level*50)*m;
        const t=now+i*.07;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.24);
        o.start(t);o.stop(t+.24);
      });
    } else {
      // 大象级别：低沉轰鸣+高频闪光
      const o=ac.createOscillator(),g=ac.createGain();
      o.connect(g);g.connect(ac.destination);o.type='sine';
      o.frequency.setValueAtTime(140,now);o.frequency.exponentialRampToValueAtTime(50,now+.35);
      g.gain.setValueAtTime(.42,now);g.gain.exponentialRampToValueAtTime(.001,now+.38);
      o.start(now);o.stop(now+.38);
      [880,1100,1320,1760].forEach((f,i)=>{
        const o2=ac.createOscillator(),g2=ac.createGain();
        o2.connect(g2);g2.connect(ac.destination);o2.type='triangle';o2.frequency.value=f;
        const t=now+i*.065;
        g2.gain.setValueAtTime(.15,t);g2.gain.exponentialRampToValueAtTime(.001,t+.3);
        o2.start(t);o2.stop(t+.3);
      });
    }
  }catch(e){}
}

// ── Particles ─────────────────────────────────────────────────────────────────
let particles=[],floatingTexts=[];
const fxCanvas=document.getElementById('fx-canvas');
const fxCtx=fxCanvas.getContext('2d');

function getCfg(l){
  if(l<=2)return{count:8,speed:2.5,size:5,life:35,icons:['✨','⭐'],colors:['#f4a460','#daa520']};
  if(l<=4)return{count:14,speed:3.5,size:7,life:45,icons:['🐾','✨','💫'],colors:['#cd853f','#ffd700','#f4a460']};
  if(l<=6)return{count:20,speed:4.5,size:9,life:55,icons:['🐾','💥','⭐','✨'],colors:['#b8860b','#ff8c00','#daa520','#20b2aa']};
  if(l<=8)return{count:28,speed:5.5,size:11,life:65,icons:['🎉','🐾','💥','🎊','✨'],colors:['#ff6347','#ff8c00','#00ced1','#9400d3','#ffd700']};
  return{count:40,speed:7,size:14,life:80,icons:['🎉','🎊','🐾','💥','🐘','⭐','🎆'],colors:['#ff4500','#ff8c00','#00fa9a','#9400d3','#ffd700','#00bfff']};
}

function spawnParticles(x,y,level){
  const cfg=getCfg(level);
  for(let i=0;i<cfg.count;i++){
    const angle=Math.PI*2/cfg.count*i+Math.random()*.4;
    const speed=cfg.speed*(.6+Math.random()*.8);
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-(level>5?2:1),
      life:cfg.life+Math.random()*20|0,maxLife:cfg.life+20,
      size:cfg.size*(.7+Math.random()*.6),
      icon:cfg.icons[Math.random()*cfg.icons.length|0],
      color:cfg.colors[Math.random()*cfg.colors.length|0],
      rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.3,useEmoji:level>=3});
  }
  const labels=['','','','好!','很好!','棒!','太棒!','超棒!!','绝了!!!','无敌!!!!','🐘传说!!!!!'];
  if(level>0) floatingTexts.push({x,y:y-10,vy:-1.6,life:55,maxLife:55,
    text:labels[Math.min(level,labels.length-1)],
    size:13+level*2,
    color:level>=9?'#ff4500':level>=6?'#ff8c00':level>=3?'#b8860b':'#8b6914'});
}

function updateFX(){
  fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  const alive=[];
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.rot+=p.rotV;p.life--;
    if(p.life<=0)continue;
    const alpha=p.life/p.maxLife;
    fxCtx.save();fxCtx.globalAlpha=alpha;fxCtx.translate(p.x,p.y);fxCtx.rotate(p.rot);
    if(p.useEmoji){
      fxCtx.font=`${p.size*2}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
      fxCtx.textAlign='center';fxCtx.textBaseline='middle';fxCtx.fillText(p.icon,0,0);
    } else {
      fxCtx.fillStyle=p.color;fxCtx.beginPath();fxCtx.arc(0,0,p.size*alpha*.8+1,0,Math.PI*2);fxCtx.fill();
      fxCtx.strokeStyle='#fff';fxCtx.lineWidth=1;
      fxCtx.beginPath();fxCtx.moveTo(-p.size*.6,0);fxCtx.lineTo(p.size*.6,0);fxCtx.moveTo(0,-p.size*.6);fxCtx.lineTo(0,p.size*.6);fxCtx.stroke();
    }
    fxCtx.restore();alive.push(p);
  }
  particles=alive;
  const aliveT=[];
  for(const t of floatingTexts){
    t.y+=t.vy;t.life--;if(t.life<=0)continue;
    const alpha=Math.min(1,t.life/(t.maxLife*.3));
    fxCtx.save();fxCtx.globalAlpha=alpha;
    fxCtx.font=`500 ${Math.round(t.size)}px var(--font-sans,sans-serif)`;
    fxCtx.textAlign='center';fxCtx.textBaseline='middle';fxCtx.fillStyle=t.color;fxCtx.fillText(t.text,t.x,t.y);
    fxCtx.restore();aliveT.push(t);
  }
  floatingTexts=aliveT;
}

// ── Game core ─────────────────────────────────────────────────────────────────
const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');
const gameArea=document.getElementById('game-area');
const aimLine=document.getElementById('aim-line');
const overlay=document.getElementById('overlay');

function getAnis(){return ALL_ANI.slice(0,parseInt(document.getElementById('ani-count').value));}
function getHeight(){return parseInt(document.getElementById('game-height').value);}

function buildLegend(){
  const as=getAnis();
  document.getElementById('legend-grid').innerHTML=as.map((a,i)=>
    `<div class="leg-item"><span class="leg-emoji">${a.emoji}</span><div class="leg-info"><span class="leg-name">${a.n}</span><span class="leg-lv">第${i+1}级</span></div></div>`
  ).join('');
}
buildLegend();
document.getElementById('ani-count').onchange=buildLegend;

function startGame(){
  if(engine){Matter.Runner.stop(runner);Matter.Engine.clear(engine);}
  if(animFrame)cancelAnimationFrame(animFrame);
  score=0;bodies=[];mergeQueue=[];scheduledIds=new Set();
  particles=[];floatingTexts=[];
  gameOver=false;canDrop=true;anis=getAnis();
  document.getElementById('score').textContent='0';
  overlay.style.display='none';resetEye();

  const h=getHeight(),w=300;
  canvas.width=w;canvas.height=h;fxCanvas.width=w;fxCanvas.height=h;
  gameArea.style.height=h+'px';dropX=w/2;

  engine=Matter.Engine.create({gravity:{y:1.5},positionIterations:10,velocityIterations:8});
  world=engine.world;runner=Matter.Runner.create({delta:1000/60});

  const wo={isStatic:true,friction:.3,restitution:.1,label:'wall'};
  Matter.Composite.add(world,[
    Matter.Bodies.rectangle(w/2,h+25,w+4,50,wo),
    Matter.Bodies.rectangle(-25,h/2,50,h*2,wo),
    Matter.Bodies.rectangle(w+25,h/2,50,h*2,wo),
  ]);
  Matter.Events.on(engine,'collisionStart',handlePairs);
  Matter.Events.on(engine,'collisionActive',handlePairs);
  Matter.Runner.run(runner,engine);

  pickNext();currentIdx=nextIdx;pickNext();
  document.getElementById('next-ani').textContent=anis[nextIdx].emoji;

  gameArea.addEventListener('mousemove',onMM);
  gameArea.addEventListener('click',onCK);
  gameArea.addEventListener('touchmove',onTM,{passive:false});
  gameArea.addEventListener('touchend',onTE);
  gameRunning=true;loop();
}

function pickNext(){
  const max=Math.min(anis.length-1,Math.floor(anis.length*.45));
  nextIdx=Math.floor(Math.random()*(max+1));
}

function spawnBody(idx,x,y){
  const a=anis[idx];
  const b=Matter.Bodies.circle(x,y,a.r,{restitution:.15,friction:.4,frictionAir:.01,density:.003,label:'ani',slop:.5});
  b.aniIdx=idx;b.born=Date.now();
  Matter.Composite.add(world,b);bodies.push(b);return b;
}

function safeRemove(b){const i=bodies.indexOf(b);if(i===-1)return false;Matter.Composite.remove(world,b);bodies.splice(i,1);return true;}

function trySchedule(a,b){
  if(a.aniIdx!==b.aniIdx)return;
  const now=Date.now();
  if(now-a.born<COOLDOWN_MS||now-b.born<COOLDOWN_MS)return;
  if(scheduledIds.has(a.id)||scheduledIds.has(b.id))return;
  scheduledIds.add(a.id);scheduledIds.add(b.id);mergeQueue.push({a,b});
}
function handlePairs(e){e.pairs.forEach(({bodyA,bodyB})=>{if(bodyA.label==='ani'&&bodyB.label==='ani')trySchedule(bodyA,bodyB);});}
function proxScan(){
  const now=Date.now();
  for(let i=0;i<bodies.length;i++) for(let j=i+1;j<bodies.length;j++){
    const a=bodies[i],b=bodies[j];
    if(a.aniIdx!==b.aniIdx)continue;
    if(now-a.born<COOLDOWN_MS||now-b.born<COOLDOWN_MS)continue;
    if(scheduledIds.has(a.id)||scheduledIds.has(b.id))continue;
    const dx=a.position.x-b.position.x,dy=a.position.y-b.position.y;
    if(Math.sqrt(dx*dx+dy*dy)<=anis[a.aniIdx].r+anis[b.aniIdx].r+PROXIMITY_GAP){
      scheduledIds.add(a.id);scheduledIds.add(b.id);mergeQueue.push({a,b});
    }
  }
}

function processMerges(){
  while(mergeQueue.length){
    const{a,b}=mergeQueue.shift();
    scheduledIds.delete(a.id);scheduledIds.delete(b.id);
    if(!safeRemove(a)||!safeRemove(b))continue;
    const mx=(a.position.x+b.position.x)/2,my=(a.position.y+b.position.y)/2;
    const ni=a.aniIdx+1;
    score+=1;document.getElementById('score').textContent=score;
    spawnParticles(mx,my,Math.min(ni,ALL_ANI.length-1));
    playMerge(Math.min(ni,ALL_ANI.length-1));
    if(ni<anis.length){
      const an=anis[ni];
      spawnBody(ni,Math.max(an.r+1,Math.min(canvas.width-an.r-1,mx)),
                   Math.max(an.r+1,Math.min(canvas.height-an.r-1,my)));
    }
  }
}

const DANGER_Y=50;let dangerFrames=0;
function drawAni(b){
  const a=anis[b.aniIdx];if(!a)return;
  ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
  ctx.font=`${a.r*2}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=1;
  ctx.fillText(a.emoji,0,0);ctx.restore();
}

function loop(){
  proxScan();processMerges();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#fdf8f0';ctx.fillRect(0,0,canvas.width,canvas.height);

  let danger=false;
  bodies.forEach(b=>{
    if(!anis[b.aniIdx])return;
    if(b.position.y-anis[b.aniIdx].r<DANGER_Y)danger=true;
    drawAni(b);
  });

  if(danger){
    dangerFrames++;
    ctx.fillStyle=`rgba(220,50,50,${Math.min(.15,dangerFrames*.001)})`;
    ctx.fillRect(0,0,canvas.width,DANGER_Y);
    if(dangerFrames>120){endGame();return;}
  } else dangerFrames=Math.max(0,dangerFrames-2);

  ctx.strokeStyle='rgba(200,80,80,.35)';ctx.setLineDash([5,4]);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,DANGER_Y);ctx.lineTo(canvas.width,DANGER_Y);ctx.stroke();ctx.setLineDash([]);

  if(canDrop&&gameRunning&&!gameOver){
    const a=anis[currentIdx];
    const cx=Math.max(a.r+1,Math.min(canvas.width-a.r-1,dropX));
    ctx.globalAlpha=.45;ctx.strokeStyle='#bbb';ctx.setLineDash([4,4]);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,canvas.height);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
    ctx.font=`${a.r*2}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(a.emoji,cx,a.r+4);
  }
  updateFX();
  animFrame=requestAnimationFrame(loop);
}

function onMM(e){if(!gameRunning||gameOver||eyeLocked)return;const rect=gameArea.getBoundingClientRect();dropX=e.clientX-rect.left;aimLine.style.left=dropX+'px';aimLine.style.height=canvas.height+'px';aimLine.style.display='block';}
function onCK(e){if(!gameRunning||gameOver||!canDrop||eyeLocked)return;drop(e.clientX-gameArea.getBoundingClientRect().left);}
function onTM(e){e.preventDefault();if(!gameRunning||gameOver||eyeLocked)return;const rect=gameArea.getBoundingClientRect();dropX=e.touches[0].clientX-rect.left;aimLine.style.left=dropX+'px';aimLine.style.display='block';}
function onTE(){if(!gameRunning||gameOver||!canDrop||eyeLocked)return;drop(dropX);}
function drop(x){
  const a=anis[currentIdx];
  spawnBody(currentIdx,Math.max(a.r+1,Math.min(canvas.width-a.r-1,x)),a.r+2);
  canDrop=false;currentIdx=nextIdx;pickNext();
  document.getElementById('next-ani').textContent=anis[nextIdx].emoji;
  setTimeout(()=>{if(!gameOver)canDrop=true;},480);
}
function endGame(){
  gameOver=true;gameRunning=false;canDrop=false;
  Matter.Runner.stop(runner);cancelAnimationFrame(animFrame);aimLine.style.display='none';
  for(let i=0;i<4;i++)setTimeout(()=>spawnParticles(80+Math.random()*140,100+Math.random()*120,9),i*120);
  overlay.innerHTML=`<h2>游戏结束 🐘</h2><p>最终得分：${score} 分</p><button onclick="startGame()">再来一局</button>`;
  overlay.style.display='flex';
}

// ── Eye care ──────────────────────────────────────────────────────────────────
let eyeLocked=false,eyeTotal=300,eyeElapsed=0,eyeTickID=null,restLeft=60,restTickID=null;
const eyeOverlay=document.getElementById('eye-overlay');
const eyeFill=document.getElementById('eye-fill');
const eyeLbl=document.getElementById('eye-lbl');
const eyeCd=document.getElementById('eye-cd');
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function resetEye(){
  clearInterval(eyeTickID);clearInterval(restTickID);
  eyeLocked=false;eyeElapsed=0;
  eyeTotal=parseInt(document.getElementById('eye-setting').value);
  eyeFill.style.width='100%';eyeLbl.textContent=fmt(eyeTotal);
  eyeOverlay.style.display='none';
  eyeTickID=setInterval(()=>{
    if(eyeLocked)return;
    eyeElapsed++;const rem=eyeTotal-eyeElapsed;
    eyeLbl.textContent=fmt(Math.max(0,rem));
    eyeFill.style.width=(rem/eyeTotal*100)+'%';
    if(rem<=0)lockEye();
  },1000);
}
function lockEye(){
  clearInterval(eyeTickID);eyeLocked=true;
  if(gameRunning&&!gameOver){Matter.Runner.stop(runner);cancelAnimationFrame(animFrame);}
  aimLine.style.display='none';restLeft=60;eyeCd.textContent=restLeft;eyeOverlay.style.display='flex';
  restTickID=setInterval(()=>{
    restLeft--;eyeCd.textContent=restLeft;
    if(restLeft<=0){
      clearInterval(restTickID);eyeOverlay.style.display='none';
      eyeLocked=false;eyeElapsed=0;
      eyeTotal=parseInt(document.getElementById('eye-setting').value);
      eyeFill.style.width='100%';eyeLbl.textContent=fmt(eyeTotal);
      resetEye();
      if(gameRunning&&!gameOver){Matter.Runner.run(runner,engine);loop();}
    }
  },1000);
}
document.getElementById('eye-setting').onchange=()=>{if(!eyeLocked)resetEye();};
window.startGame=startGame;
startGame();
</script>
