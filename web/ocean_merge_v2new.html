
<style>

.s-block{padding:9px 12px;border-bottom:0.5px solid #9acce0}

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const ALL_SEA = [
  {emoji:'🦐', r:14, n:'小虾'},
  {emoji:'🐚', r:19, n:'贝壳'},
  {emoji:'🦀', r:24, n:'螃蟹'},
  {emoji:'🐠', r:29, n:'热带鱼'},
  {emoji:'🐡', r:34, n:'河豚'},
  {emoji:'🦑', r:39, n:'鱿鱼'},
  {emoji:'🐙', r:45, n:'章鱼'},
  {emoji:'🦈', r:51, n:'鲨鱼'},
  {emoji:'🐢', r:57, n:'海龟'},
  {emoji:'🐬', r:64, n:'海豚'},
  {emoji:'🐋', r:72, n:'蓝鲸'},
];

let engine,runner,world;
let bodies=[],score=0,seas=[];
let nextIdx=0,currentIdx=0;
let gameRunning=false,canDrop=true,dropX=150;
let gameOver=false,animFrame;
let mergeQueue=[],scheduledIds=new Set();
const COOLDOWN_MS=150,PROXIMITY_GAP=3;

let bubbles=[],bgTick=0;
function makeBubbles(w,h){
  bubbles=[];
  for(let i=0;i<20;i++) bubbles.push({
    x:Math.random()*w, y:Math.random()*h,
    r:Math.random()*4+1.5,
    vy:-(Math.random()*.4+.15),
    alpha:Math.random()*.4+.15,
  });
}

// ── Audio ─────────────────────────────────────────────────────────────────────
let audioCtx=null;
function getAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function playMerge(level){
  try{
    const ac=getAC(),now=ac.currentTime;
    if(level<=2){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';const f=600+level*70;o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*1.5,now+.07);g.gain.setValueAtTime(.15,now);g.gain.exponentialRampToValueAtTime(.001,now+.16);o.start(now);o.stop(now+.16);}
    else if(level<=5){[1,1.4].forEach((m,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='triangle';const f=(500+level*65)*m,t=now+i*.04;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.17,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.frequency.value=f;o.start(t);o.stop(t+.32);});}
    else if(level<=8){[1,1.25,1.5,2].forEach((m,i)=>{const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.connect(fl);fl.connect(g);g.connect(ac.destination);fl.type='lowpass';fl.frequency.value=1400;o.type='square';o.frequency.value=(300+level*40)*m;const t=now+i*.07;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.start(t);o.stop(t+.28);});}
    else{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.setValueAtTime(110,now);o.frequency.exponentialRampToValueAtTime(55,now+.5);g.gain.setValueAtTime(.4,now);g.gain.exponentialRampToValueAtTime(.001,now+.55);o.start(now);o.stop(now+.55);[880,1100,1320].forEach((f,i)=>{const o2=ac.createOscillator(),g2=ac.createGain();o2.connect(g2);g2.connect(ac.destination);o2.type='triangle';o2.frequency.value=f;const t=now+i*.06;g2.gain.setValueAtTime(.12,t);g2.gain.exponentialRampToValueAtTime(.001,t+.3);o2.start(t);o2.stop(t+.3);});}
  }catch(e){}
}

// ── Particles ─────────────────────────────────────────────────────────────────
let particles=[],floatingTexts=[];
const fxCanvas=document.getElementById('fx-canvas');
const fxCtx=fxCanvas.getContext('2d');

function getCfg(l){
  if(l<=2)return{count:8,speed:2.5,size:5,life:32,icons:['💧','✨'],colors:['#44aadd','#88ccee','#aaddff']};
  if(l<=4)return{count:14,speed:3.2,size:7,life:44,icons:['💦','✨','💫'],colors:['#22aacc','#66ddff','#44bbdd']};
  if(l<=6)return{count:20,speed:4.2,size:9,life:54,icons:['🌊','💦','⭐','✨'],colors:['#1199bb','#44ddff','#ffaa44','#aaeeff']};
  if(l<=8)return{count:28,speed:5.2,size:11,life:64,icons:['🎉','🌊','💥','🐠','✨'],colors:['#ff6644','#44ddff','#ffcc44','#11bbaa','#aaeeff']};
  return{count:40,speed:6.8,size:14,life:80,icons:['🎉','🎊','🌊','💥','🐋','⭐','🎆'],colors:['#ff4422','#44ddff','#00ffcc','#ffcc00','#88eeff','#ff8844']};
}

function spawnParticles(x,y,level){
  const cfg=getCfg(level);
  for(let i=0;i<cfg.count;i++){
    const angle=Math.PI*2/cfg.count*i+Math.random()*.4;
    const speed=cfg.speed*(.6+Math.random()*.8);
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-(level>5?2:1),
      life:cfg.life+Math.random()*20|0,maxLife:cfg.life+20,
      size:cfg.size*(.7+Math.random()*.6),
      icon:cfg.icons[Math.random()*cfg.icons.length|0],
      color:cfg.colors[Math.random()*cfg.colors.length|0],
      rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.3,useEmoji:level>=3});
  }
  const labels=['','','','好!','漂亮!','精彩!','太棒!','超神!!','绝了!!!','神级!!!!','🐋传说!!!!!'];
  if(level>0) floatingTexts.push({x,y:y-10,vy:-1.6,life:55,maxLife:55,
    text:labels[Math.min(level,labels.length-1)],size:13+level*2,
    color:level>=9?'#ff4422':level>=6?'#0088bb':level>=3?'#0066aa':'#2288aa'});
}

function updateFX(){
  fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  const alive=[];
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.rot+=p.rotV;p.life--;
    if(p.life<=0)continue;
    const alpha=p.life/p.maxLife;
    fxCtx.save();fxCtx.globalAlpha=alpha;fxCtx.translate(p.x,p.y);fxCtx.rotate(p.rot);
    if(p.useEmoji){fxCtx.font=`${p.size*2}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;fxCtx.textAlign='center';fxCtx.textBaseline='middle';fxCtx.fillText(p.icon,0,0);}
    else{fxCtx.fillStyle=p.color;fxCtx.beginPath();fxCtx.arc(0,0,p.size*alpha*.8+1,0,Math.PI*2);fxCtx.fill();}
    fxCtx.restore();alive.push(p);
  }
  particles=alive;
  const aliveT=[];
  for(const t of floatingTexts){
    t.y+=t.vy;t.life--;if(t.life<=0)continue;
    const alpha=Math.min(1,t.life/(t.maxLife*.3));
    fxCtx.save();fxCtx.globalAlpha=alpha;
    fxCtx.font=`600 ${Math.round(t.size)}px sans-serif`;
    fxCtx.textAlign='center';fxCtx.textBaseline='middle';
    fxCtx.fillStyle=t.color;fxCtx.fillText(t.text,t.x,t.y);
    fxCtx.restore();aliveT.push(t);
  }
  floatingTexts=aliveT;
}

// ── Game core ─────────────────────────────────────────────────────────────────
const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');
const gameArea=document.getElementById('game-area');
const aimLine=document.getElementById('aim-line');
const overlay=document.getElementById('overlay');

function getSeas(){return ALL_SEA.slice(0,parseInt(document.getElementById('sea-count').value));}
function getHeight(){return parseInt(document.getElementById('game-height').value);}

function buildLegend(){
  const ss=getSeas();
  document.getElementById('legend-grid').innerHTML=ss.map((s,i)=>
    `<div class="leg-item"><span class="leg-emoji">${s.emoji}</span><div class="leg-info"><span class="leg-name">${s.n}</span><span class="leg-lv">第${i+1}级</span></div></div>`
  ).join('');
}
buildLegend();
document.getElementById('sea-count').onchange=buildLegend;

function drawBackground(w,h){
  bgTick+=.007;
  // 明亮浅蓝渐变——从上到下由浅到稍深
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#c8ecfa');
  grad.addColorStop(0.45,'#9dd8f0');
  grad.addColorStop(1,'#6ec4e8');
  ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);

  // 阳光从上方折射下来的光柱
  ctx.save();
  for(let i=0;i<5;i++){
    const x=w*.08+i*w*.22+Math.sin(bgTick*.8+i)*10;
    const lg=ctx.createLinearGradient(x,0,x+16,h*.55);
    lg.addColorStop(0,'rgba(255,255,255,.18)');
    lg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=lg;
    ctx.beginPath();ctx.moveTo(x-14,0);ctx.lineTo(x+20,h*.55);ctx.lineTo(x+6,h*.55);ctx.lineTo(x,0);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();

  // 波纹线（水面感）
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1.2;
  for(let row=0;row<3;row++){
    const baseY=h*.15+row*h*.12;
    ctx.beginPath();
    for(let x=0;x<=w;x+=4){
      const y=baseY+Math.sin(x*.04+bgTick+row*1.2)*3;
      x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();

  // 气泡
  bubbles.forEach(b=>{
    b.y+=b.vy;if(b.y<-10){b.y=h+5;b.x=Math.random()*w;}
    ctx.save();ctx.globalAlpha=b.alpha;
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=.9;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
    // 气泡高光
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath();ctx.arc(b.x-b.r*.3,b.y-b.r*.3,b.r*.35,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  // 海底沙地
  ctx.fillStyle='rgba(180,220,200,.5)';
  ctx.fillRect(0,h-10,w,10);
  ctx.fillStyle='rgba(160,210,185,.35)';
  for(let i=0;i<w;i+=10){
    const bh=2+Math.sin(i*.28+bgTick*1.5)*2;
    ctx.fillRect(i,h-10-bh,8,bh+1);
  }
}

function startGame(){
  if(engine){Matter.Runner.stop(runner);Matter.Engine.clear(engine);}
  if(animFrame)cancelAnimationFrame(animFrame);
  score=0;bodies=[];mergeQueue=[];scheduledIds=new Set();
  particles=[];floatingTexts=[];
  gameOver=false;canDrop=true;seas=getSeas();
  document.getElementById('score').textContent='0';
  overlay.style.display='none';resetEye();
  const h=getHeight(),w=300;
  canvas.width=w;canvas.height=h;fxCanvas.width=w;fxCanvas.height=h;
  gameArea.style.height=h+'px';dropX=w/2;
  makeBubbles(w,h);

  engine=Matter.Engine.create({gravity:{y:1.5},positionIterations:10,velocityIterations:8});
  world=engine.world;runner=Matter.Runner.create({delta:1000/60});
  const wo={isStatic:true,friction:.3,restitution:.12,label:'wall'};
  Matter.Composite.add(world,[Matter.Bodies.rectangle(w/2,h+25,w+4,50,wo),Matter.Bodies.rectangle(-25,h/2,50,h*2,wo),Matter.Bodies.rectangle(w+25,h/2,50,h*2,wo)]);
  Matter.Events.on(engine,'collisionStart',handlePairs);
  Matter.Events.on(engine,'collisionActive',handlePairs);
  Matter.Runner.run(runner,engine);
  pickNext();currentIdx=nextIdx;pickNext();
  document.getElementById('next-sea').textContent=seas[nextIdx].emoji;
  gameArea.addEventListener('mousemove',onMM);
  gameArea.addEventListener('click',onCK);
  gameArea.addEventListener('touchmove',onTM,{passive:false});
  gameArea.addEventListener('touchend',onTE);
  gameRunning=true;loop();
}

function pickNext(){const max=Math.min(seas.length-1,Math.floor(seas.length*.45));nextIdx=Math.floor(Math.random()*(max+1));}
function spawnBody(idx,x,y){const s=seas[idx];const b=Matter.Bodies.circle(x,y,s.r,{restitution:.15,friction:.4,frictionAir:.011,density:.003,label:'sea',slop:.5});b.seaIdx=idx;b.born=Date.now();Matter.Composite.add(world,b);bodies.push(b);return b;}
function safeRemove(b){const i=bodies.indexOf(b);if(i===-1)return false;Matter.Composite.remove(world,b);bodies.splice(i,1);return true;}
function trySchedule(a,b){if(a.seaIdx!==b.seaIdx)return;const now=Date.now();if(now-a.born<COOLDOWN_MS||now-b.born<COOLDOWN_MS)return;if(scheduledIds.has(a.id)||scheduledIds.has(b.id))return;scheduledIds.add(a.id);scheduledIds.add(b.id);mergeQueue.push({a,b});}
function handlePairs(e){e.pairs.forEach(({bodyA,bodyB})=>{if(bodyA.label==='sea'&&bodyB.label==='sea')trySchedule(bodyA,bodyB);});}
function proxScan(){const now=Date.now();for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){const a=bodies[i],b=bodies[j];if(a.seaIdx!==b.seaIdx)continue;if(now-a.born<COOLDOWN_MS||now-b.born<COOLDOWN_MS)continue;if(scheduledIds.has(a.id)||scheduledIds.has(b.id))continue;const dx=a.position.x-b.position.x,dy=a.position.y-b.position.y;if(Math.sqrt(dx*dx+dy*dy)<=seas[a.seaIdx].r+seas[b.seaIdx].r+PROXIMITY_GAP){scheduledIds.add(a.id);scheduledIds.add(b.id);mergeQueue.push({a,b});}}}
function processMerges(){while(mergeQueue.length){const{a,b}=mergeQueue.shift();scheduledIds.delete(a.id);scheduledIds.delete(b.id);if(!safeRemove(a)||!safeRemove(b))continue;const mx=(a.position.x+b.position.x)/2,my=(a.position.y+b.position.y)/2;const ni=a.seaIdx+1;score+=1;document.getElementById('score').textContent=score;spawnParticles(mx,my,Math.min(ni,ALL_SEA.length-1));playMerge(Math.min(ni,ALL_SEA.length-1));if(ni<seas.length){const s=seas[ni];spawnBody(ni,Math.max(s.r+1,Math.min(canvas.width-s.r-1,mx)),Math.max(s.r+1,Math.min(canvas.height-s.r-1,my)));}}}

const DANGER_Y=50;let dangerFrames=0;

function drawSea(b){
  const s=seas[b.seaIdx];if(!s)return;
  ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
  if(b.seaIdx>=6){ctx.shadowBlur=s.r*.9;const glows=['#44ffcc','#44aaff','#ff8844','#44ddff','#ffcc44'];ctx.shadowColor=glows[Math.min(b.seaIdx-6,glows.length-1)];}
  ctx.font=`${s.r*2}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=1;
  ctx.fillText(s.emoji,0,0);ctx.restore();
}

function loop(){
  proxScan();processMerges();
  drawBackground(canvas.width,canvas.height);
  let danger=false;
  bodies.forEach(b=>{if(!seas[b.seaIdx])return;if(b.position.y-seas[b.seaIdx].r<DANGER_Y)danger=true;drawSea(b);});
  if(danger){dangerFrames++;ctx.fillStyle=`rgba(220,80,50,${Math.min(.12,dangerFrames*.001)})`;ctx.fillRect(0,0,canvas.width,DANGER_Y);if(dangerFrames>120){endGame();return;}}
  else dangerFrames=Math.max(0,dangerFrames-2);
  ctx.strokeStyle='rgba(30,120,180,.5)';ctx.setLineDash([5,4]);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,DANGER_Y);ctx.lineTo(canvas.width,DANGER_Y);ctx.stroke();ctx.setLineDash([]);
  if(canDrop&&gameRunning&&!gameOver){
    const s=seas[currentIdx];const cx=Math.max(s.r+1,Math.min(canvas.width-s.r-1,dropX));
    ctx.globalAlpha=.6;ctx.strokeStyle='rgba(30,100,160,.7)';ctx.setLineDash([4,4]);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,canvas.height);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;
    ctx.font=`${s.r*2}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.globalAlpha=.9;ctx.fillText(s.emoji,cx,s.r+4);ctx.globalAlpha=1;
  }
  updateFX();animFrame=requestAnimationFrame(loop);
}

function onMM(e){if(!gameRunning||gameOver||eyeLocked)return;const rect=gameArea.getBoundingClientRect();dropX=e.clientX-rect.left;aimLine.style.left=dropX+'px';aimLine.style.height=canvas.height+'px';aimLine.style.display='block';}
function onCK(e){if(!gameRunning||gameOver||!canDrop||eyeLocked)return;drop(e.clientX-gameArea.getBoundingClientRect().left);}
function onTM(e){e.preventDefault();if(!gameRunning||gameOver||eyeLocked)return;const rect=gameArea.getBoundingClientRect();dropX=e.touches[0].clientX-rect.left;aimLine.style.left=dropX+'px';aimLine.style.display='block';}
function onTE(){if(!gameRunning||gameOver||!canDrop||eyeLocked)return;drop(dropX);}
function drop(x){const s=seas[currentIdx];spawnBody(currentIdx,Math.max(s.r+1,Math.min(canvas.width-s.r-1,x)),s.r+2);canDrop=false;currentIdx=nextIdx;pickNext();document.getElementById('next-sea').textContent=seas[nextIdx].emoji;setTimeout(()=>{if(!gameOver)canDrop=true;},480);}
function endGame(){gameOver=true;gameRunning=false;canDrop=false;Matter.Runner.stop(runner);cancelAnimationFrame(animFrame);aimLine.style.display='none';for(let i=0;i<5;i++)setTimeout(()=>spawnParticles(60+Math.random()*180,80+Math.random()*140,9),i*110);overlay.innerHTML=`<h2>游戏结束 🐋</h2><p>最终得分：${score} 分</p><button onclick="startGame()">再来一局</button>`;overlay.style.display='flex';}

let eyeLocked=false,eyeTotal=300,eyeElapsed=0,eyeTickID=null,restLeft=60,restTickID=null;
const eyeOverlay=document.getElementById('eye-overlay');
const eyeFill=document.getElementById('eye-fill');const eyeLbl=document.getElementById('eye-lbl');const eyeCd=document.getElementById('eye-cd');
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function resetEye(){clearInterval(eyeTickID);clearInterval(restTickID);eyeLocked=false;eyeElapsed=0;eyeTotal=parseInt(document.getElementById('eye-setting').value);eyeFill.style.width='100%';eyeLbl.textContent=fmt(eyeTotal);eyeOverlay.style.display='none';eyeTickID=setInterval(()=>{if(eyeLocked)return;eyeElapsed++;const rem=eyeTotal-eyeElapsed;eyeLbl.textContent=fmt(Math.max(0,rem));eyeFill.style.width=(rem/eyeTotal*100)+'%';if(rem<=0)lockEye();},1000);}
function lockEye(){clearInterval(eyeTickID);eyeLocked=true;if(gameRunning&&!gameOver){Matter.Runner.stop(runner);cancelAnimationFrame(animFrame);}aimLine.style.display='none';restLeft=60;eyeCd.textContent=restLeft;eyeOverlay.style.display='flex';restTickID=setInterval(()=>{restLeft--;eyeCd.textContent=restLeft;if(restLeft<=0){clearInterval(restTickID);eyeOverlay.style.display='none';eyeLocked=false;eyeElapsed=0;eyeTotal=parseInt(document.getElementById('eye-setting').value);eyeFill.style.width='100%';eyeLbl.textContent=fmt(eyeTotal);resetEye();if(gameRunning&&!gameOver){Matter.Runner.run(runner,engine);loop();}}},1000);}
document.getElementById('eye-setting').onchange=()=>{if(!eyeLocked)resetEye();};
window.startGame=startGame;
startGame();
</script>
