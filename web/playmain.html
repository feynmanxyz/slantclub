<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儿童智力乐园</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .background {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .clickable-area {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            border-radius: 50%;
        }

        .clickable-area:hover {
            border-color: rgba(255, 255, 255, 0.8);
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .clickable-area:active {
            transform: scale(0.95);
        }

        /* 粉色蘑菇房子的门 - 左下角 */
        .door1 {
            left: 8.5%;
            top: 54.5%;
            width: 4%;
            height: 8%;
        }

        /* 蓝色大蘑菇房子的门 - 中间偏左 */
        .door2 {
            left: 21%;
            top: 45%;
            width: 3%;
            height: 8%;
        }

        /* 红色大蘑菇房子的门 - 右边 */
        .door3 {
            left: 61.5%;
            top: 40%;
            width: 3%;
            height: 6%;
        }

        /* 橙红色蘑菇房子的门 - 中间偏右 */
        .door4 {
            left: 40%;
            top: 45%;
            width: 5%;
            height: 12%;
        }

        /* 门上的标题文字 */
        .door-label {
            position: absolute;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            animation: swing 2s ease-in-out infinite;
            transform-origin: top center;
            white-space: nowrap;
        }

        .door-label:hover {
            transform: scale(1.1);
            animation: none;
        }

        @keyframes swing {
            0%, 100% {
                transform: rotate(-5deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }

        .label1 {
            left: 8%;
            top: 50%;
            background: linear-gradient(135deg, #df8c97 0%, #e79393 100%);
        }

        .label2 {
            left: 20%;
            top: 42.5%;
            background: linear-gradient(135deg, #4ccfb3 0%, #6ee7b5 100%);
        }

        .label3 {
            left: 60.7%;
            top: 37.5%;
            background: linear-gradient(135deg, #ec4545 0%, #ec5353 100%);
        }

        .label4 {
            left: 40%;
            top: 40%;
            background: linear-gradient(135deg, #e0693a 0%, #ff6a88 100%);
        }

        /* 河流中的漂浮按钮 */
        .river-button {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            text-align: center;
            z-index: 5;
        }

        .river-button:hover {
            transform: scale(1.15) !important;
            z-index: 10;
        }

        .river-button.active {
            transform: scale(0.9) !important;
        }

        /* 漂浮动画 */
        @keyframes float1 {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(10px, -15px) rotate(5deg);
            }
            50% {
                transform: translate(-5px, -10px) rotate(-3deg);
            }
            75% {
                transform: translate(8px, -20px) rotate(4deg);
            }
        }

        @keyframes float2 {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(-12px, -18px) rotate(-6deg);
            }
            66% {
                transform: translate(15px, -12px) rotate(5deg);
            }
        }

        @keyframes float3 {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(-8px, -22px) rotate(4deg);
            }
            50% {
                transform: translate(12px, -15px) rotate(-5deg);
            }
            75% {
                transform: translate(-10px, -18px) rotate(3deg);
            }
        }

        .btn1 {
            left: 15%;
            top: 70%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation: float1 4s ease-in-out infinite;
        }

        .btn2 {
            left: 26%;
            top: 70%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            animation: float2 3.5s ease-in-out infinite;
        }

        .btn3 {
            left: 37%;
            top: 68%;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            animation: float3 4.2s ease-in-out infinite;
        }

        .btn4 {
            left: 48%;
            top: 63%;
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            animation: float1 3.8s ease-in-out infinite 0.5s;
        }

        .btn5 {
            left: 59%;
            top: 58%;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            animation: float2 4.1s ease-in-out infinite 0.8s;
        }

        .btn6 {
            left: 70%;
            top: 52%;
            background: linear-gradient(135deg, #ff9a56 0%, #ff6a88 100%);
            animation: float3 3.6s ease-in-out infinite 1s;
        }

        /* 小按钮容器 */
        .sub-buttons {
            position: absolute;
            display: none;
            z-index: 15;
        }

        .sub-buttons.active {
            display: block;
        }

        /* 小按钮样式 */
        .sub-button {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            opacity: 0;
            transform: scale(0);
        }

        .sub-button:hover {
            transform: scale(1.2) !important;
            z-index: 20;
        }

        /* 小按钮弹出动画 */
        .sub-buttons.active .sub-button {
            animation: popIn 0.4s ease-out forwards;
        }

        .sub-buttons.active .sub-button:nth-child(1) {
            animation-delay: 0.1s;
        }

        .sub-buttons.active .sub-button:nth-child(2) {
            animation-delay: 0.2s;
        }

        .sub-buttons.active .sub-button:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            70% {
                transform: scale(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 小按钮位置（三角形分布） */
        .sub-button:nth-child(1) {
            left: -70px;
            top: -30px;
        }

        .sub-button:nth-child(2) {
            left: 20px;
            top: -80px;
        }

        .sub-button:nth-child(3) {
            left: 90px;
            top: -30px;
        }

        /* 提示标签 */
        .tooltip {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            color: #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            animation: bounce 2s infinite;
            z-index: 1;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(-10px);
            }
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 4;
        }

        .overlay.active {
            display: block;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .tooltip {
                font-size: 14px;
                padding: 10px 20px;
            }
            
            .door-label {
                font-size: 12px;
                padding: 6px 12px;
            }
            
            .river-button {
                width: 60px;
                height: 60px;
                font-size: 11px;
            }

            .sub-button {
                width: 50px;
                height: 50px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="img/playmain.jpg" alt="儿童智力乐园" class="background">
        
        <!-- 遮罩层 -->
        <div class="overlay" id="overlay"></div>
        
        <!-- 四个蘑菇房子的门的可点击区域 -->
        <a href="magic_sum_game.html" target="_blank" class="clickable-area door1" title="数阵游戏"></a>
        <a href="point24_game4.html" target="_blank" class="clickable-area door2" title="24点"></a>
        <a href="math_maze3.html" target="_blank" class="clickable-area door3" title="数字迷宫游戏"></a>
        <a href="sudoku_game.html" target="_blank" class="clickable-area door4" title="数独游戏"></a>
        
        <!-- 门上的标题标签 -->
        <a href="magic_sum_game.html" target="_blank" class="door-label label1">数阵游戏</a>
        <a href="point24_game4.html" target="_blank" class="door-label label2">24点挑战</a>
        <a href="math_maze3.html" target="_blank" class="door-label label3">数字迷宫</a>
        <a href="sudoku_game.html" target="_blank" class="door-label label4">数独游戏</a>
        
        <!-- 河流中的6个漂浮按钮 -->
        <div class="river-button btn1" data-group="1">1年级</div>
        <div class="river-button btn2" data-group="2">2年级</div>
        <div class="river-button btn3" data-group="3">3年级</div>
        <div class="river-button btn4" data-group="4">4年级</div>
        <div class="river-button btn5" data-group="5">5年级</div>
        <div class="river-button btn6" data-group="6">6年级</div>
        
        <!-- 按钮1的子按钮 -->
        <div class="sub-buttons" id="sub-group-1">
            <a href="math_shugan1-5.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">数感1</a>
            <a href="math_shugan1-5.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #5f72bd 0%, #9921e8 100%);">数感2</a>
        </div>
        
        <!-- 按钮2的子按钮 -->
        <div class="sub-buttons" id="sub-group-2">
            <a href="math_practice2.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">口算2</a>
            <a href="shopping_math_game2.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #fa709a 0%, #f14f7c 100%);">商店购物2</a>
            <a href="math_maze3.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #5ee7df 0%, #b490ca 100%);">迷宫</a>
        </div>
        
        <!-- 按钮3的子按钮 -->
        <div class="sub-buttons" id="sub-group-3">
            <a href="math_practice3.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #7f7fd5 0%, #86a8e7 100%);">口算3</a>
            <a href="math-blocks-game3.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #ff6a88 0%, #ff99ac 100%);">方块游戏</a>
            <a href="shopping_math_game3.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">商店购物3</a>
        </div>
        
        <!-- 按钮4的子按钮 -->
        <div class="sub-buttons" id="sub-group-4">
            <a href="math_game3.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">找数字</a>
            <a href="shopping_math_game4.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">商店购物4</a>
            <a href="math_practice4.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #13f1fc 0%, #0470dc 100%);">口算4</a>
        </div>
        
        <!-- 按钮5的子按钮 -->
        <div class="sub-buttons" id="sub-group-5">
            <a href="point24_game4.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);">24点挑战</a>
            <a href="magic_sum_game.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);">加法联线</a>
            <a href="lights_out_game.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #fdcbf1 0%, #e6dee9 100%);">关灯游戏</a>
        </div>
        
        <!-- 按钮6的子按钮 -->
        <div class="sub-buttons" id="sub-group-6">
            <a href="sudoku_game.html" target="_blank" class="sub-button" style="background: linear-gradient(135deg, #ff9a56 0%, #ff6a88 100%);">数独挑战</a>
        </div>
        
        <div class="tooltip">
            ✨ 快来点击进入探险吧！✨ 
        </div>
    </div>

    <script>
        // 为每个门添加效果
        const doors = document.querySelectorAll('.clickable-area');
        
        doors.forEach(door => {
            door.addEventListener('mouseenter', function() {
                this.style.boxShadow = '0 0 20px rgba(255, 255, 100, 0.8)';
            });
            
            door.addEventListener('mouseleave', function() {
                this.style.boxShadow = 'none';
            });
        });

        // 3秒后隐藏提示
        setTimeout(() => {
            const tooltip = document.querySelector('.tooltip');
            tooltip.style.opacity = '0';
            tooltip.style.transition = 'opacity 1s';
        }, 3000);

        // 河流按钮点击事件
        const riverButtons = document.querySelectorAll('.river-button');
        const overlay = document.getElementById('overlay');
        let currentActiveGroup = null;

        riverButtons.forEach(button => {
            button.addEventListener('click', function(e) {
                e.stopPropagation();
                const groupId = this.getAttribute('data-group');
                const subGroup = document.getElementById('sub-group-' + groupId);
                
                // 如果点击的是已激活的按钮，则关闭
                if (currentActiveGroup === subGroup) {
                    closeSubButtons();
                    return;
                }
                
                // 关闭其他所有子按钮
                closeSubButtons();
                
                // 显示当前子按钮组
                if (subGroup) {
                    // 设置子按钮组的位置
                    const rect = this.getBoundingClientRect();
                    subGroup.style.left = rect.left + 'px';
                    subGroup.style.top = rect.top + 'px';
                    
                    // 激活
                    subGroup.classList.add('active');
                    overlay.classList.add('active');
                    this.classList.add('active');
                    currentActiveGroup = subGroup;
                }
            });
        });

        // 点击遮罩层关闭子按钮
        overlay.addEventListener('click', function() {
            closeSubButtons();
        });

        // 关闭所有子按钮
        function closeSubButtons() {
            document.querySelectorAll('.sub-buttons').forEach(group => {
                group.classList.remove('active');
            });
            document.querySelectorAll('.river-button').forEach(btn => {
                btn.classList.remove('active');
            });
            overlay.classList.remove('active');
            currentActiveGroup = null;
        }

        // ESC键关闭
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSubButtons();
            }
        });
    </script>
</body>
</html>
