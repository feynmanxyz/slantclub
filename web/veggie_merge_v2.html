
<style>
*{box-sizing:border-box;margin:0;padding:0}
#root{display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px}
#game-wrap{display:inline-flex;gap:0;border:1.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
#game-area{width:300px;flex-shrink:0;position:relative;background:#f4fbf4;cursor:crosshair;border-right:1px solid var(--color-border-tertiary)}
#game-canvas{display:block}
#fx-canvas{position:absolute;inset:0;pointer-events:none}
#sidebar{width:140px;flex-shrink:0;display:flex;flex-direction:column;background:var(--color-background-primary)}
.s-block{padding:9px 12px;border-bottom:0.5px solid var(--color-border-tertiary)}
.s-label{font-size:11px;color:var(--color-text-secondary);margin-bottom:3px}
.score-val{font-size:26px;font-weight:500;color:var(--color-text-primary);line-height:1}
.next-box{font-size:32px;text-align:center;line-height:1.3;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.s-block select{width:100%;font-size:12px;padding:3px 5px;border:0.5px solid var(--color-border-secondary);border-radius:6px;background:var(--color-background-primary);color:var(--color-text-primary);margin-top:2px}
.eye-bar{height:5px;border-radius:3px;background:var(--color-border-tertiary);overflow:hidden;margin-top:5px}
.eye-fill{height:100%;background:#2d8a4e;border-radius:3px;transition:width .9s linear}
.start-btn{margin:8px 12px;padding:8px;background:#2d8a4e;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer}
.start-btn:hover{background:#236e3e}
#aim-line{position:absolute;top:0;width:1px;background:rgba(120,120,120,.35);pointer-events:none;transform:translateX(-50%);display:none}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:10}
#overlay h2{font-size:19px;font-weight:500;color:#fff}
#overlay p{font-size:13px;color:rgba(255,255,255,.85);text-align:center;padding:0 12px}
#overlay button{padding:8px 22px;background:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:500}
#eye-overlay{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,40,25,.92);border-radius:var(--border-radius-lg)}
#eye-overlay h2{color:#7ee8b0;font-size:18px;font-weight:500}
#eye-overlay p{color:rgba(200,240,220,.85);font-size:13px;text-align:center;line-height:1.7;padding:0 16px}
#eye-cd{font-size:40px;font-weight:500;color:#7ee8b0}
#legend-wrap{width:100%;max-width:452px;border:1.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);overflow:hidden;background:var(--color-background-primary)}
#legend-title{padding:7px 14px;font-size:12px;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary)}
#legend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.leg-item{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:0.5px solid var(--color-border-tertiary);border-right:0.5px solid var(--color-border-tertiary)}
.leg-emoji{font-size:20px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.leg-info{display:flex;flex-direction:column}
.leg-name{font-size:11px;color:var(--color-text-primary)}
.leg-lv{font-size:10px;color:var(--color-text-secondary)}
</style>

<div id="root">
  <div style="position:relative">
    <div id="game-wrap">
      <div id="game-area">
        <div id="aim-line"></div>
        <canvas id="game-canvas"></canvas>
        <canvas id="fx-canvas"></canvas>
        <div id="overlay">
          <h2>🥦 蔬菜合并</h2>
          <p>相同蔬菜碰撞合并升级<br>堆满即结束</p>
          <button onclick="startGame()">开始游戏</button>
        </div>
      </div>
      <div id="sidebar">
        <div class="s-block"><div class="s-label">得分</div><div class="score-val" id="score">0</div></div>
        <div class="s-block"><div class="s-label">下一个</div><div class="next-box" id="next-veg">🥒</div></div>
        <div class="s-block">
          <div class="s-label">蔬菜种类</div>
          <select id="veg-count">
            <option value="5">5种（简单）</option>
            <option value="7" selected>7种（普通）</option>
            <option value="9">9种（困难）</option>
            <option value="11">11种（地狱）</option>
          </select>
        </div>
        <div class="s-block">
          <div class="s-label">游戏区高度</div>
          <select id="game-height">
            <option value="350">矮（难）</option>
            <option value="450" selected>中</option>
            <option value="580">高（易）</option>
          </select>
        </div>
        <div class="s-block">
          <div class="s-label">护眼定时 <span id="eye-lbl" style="float:right;font-weight:500;color:var(--color-text-primary)">05:00</span></div>
          <select id="eye-setting">
            <option value="300" selected>5分钟</option>
            <option value="360">6分钟</option>
            <option value="420">7分钟</option>
            <option value="480">8分钟</option>
            <option value="540">9分钟</option>
            <option value="600">10分钟</option>
          </select>
          <div class="eye-bar"><div class="eye-fill" id="eye-fill" style="width:100%"></div></div>
        </div>
        <button class="start-btn" onclick="startGame()">开始游戏</button>
      </div>
    </div>
    <div id="eye-overlay">
      <div style="font-size:44px">👁️</div>
      <h2>护眼休息时间</h2>
      <p>请放松眼睛<br>看看远处绿色</p>
      <div id="eye-cd">60</div>
      <div style="font-size:11px;color:rgba(180,220,200,.7)">休息后自动恢复</div>
    </div>
  </div>
  <div id="legend-wrap">
    <div id="legend-title">蔬菜图鉴</div>
    <div id="legend-grid"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const ALL_VEG = [
  {emoji:'🥒', r:15, n:'黄瓜'},
  {emoji:'🌽', r:20, n:'玉米'},
  {emoji:'🥕', r:25, n:'胡萝卜'},
  {emoji:'🧅', r:30, n:'洋葱'},
  {emoji:'🥔', r:35, n:'土豆'},
  {emoji:'🍆', r:40, n:'茄子'},
  {emoji:'🥦', r:46, n:'西兰花'},
  {emoji:'🥬', r:52, n:'白菜'},
  {emoji:'🎃', r:58, n:'南瓜'},
  {emoji:'🍄', r:65, n:'蘑菇'},
  {emoji:'🥜', r:72, n:'花生'},
];

let engine,runner,world;
let bodies=[],score=0,vegs=[];
let nextIdx=0,currentIdx=0;
let gameRunning=false,canDrop=true,dropX=150;
let gameOver=false,animFrame;
let mergeQueue=[],scheduledIds=new Set();
const COOLDOWN_MS=150,PROXIMITY_GAP=3;

let audioCtx=null;
function getAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function playMerge(level){
  try{
    const ac=getAC(),now=ac.currentTime;
    if(level<=2){const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';const f=480+level*55;o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(f*1.4,now+.08);g.gain.setValueAtTime(.18,now);g.gain.exponentialRampToValueAtTime(.001,now+.18);o.start(now);o.stop(now+.18);}
    else if(level<=5){[1,1.5].forEach((m,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='triangle';const f=(580+level*75)*m,t=now+i*.04;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.frequency.value=f;o.start(t);o.stop(t+.32);});}
    else if(level<=8){[1,1.26,1.5,2].forEach((m,i)=>{const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.connect(fl);fl.connect(g);g.connect(ac.destination);fl.type='lowpass';fl.frequency.value=1800;o.type='square';o.frequency.value=(380+level*48)*m;const t=now+i*.07;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.22);});}
    else{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.setValueAtTime(160,now);o.frequency.exponentialRampToValueAtTime(55,now+.3);g.gain.setValueAtTime(.38,now);g.gain.exponentialRampToValueAtTime(.001,now+.35);o.start(now);o.stop(now+.35);[840,1050,1260,1680].forEach((f,i)=>{const o2=ac.createOscillator(),g2=ac.createGain();o2.connect(g2);g2.connect(ac.destination);o2.type='triangle';o2.frequency.value=f;const t=now+i*.06;g2.gain.setValueAtTime(.14,t);g2.gain.exponentialRampToValueAtTime(.001,t+.28);o2.start(t);o2.stop(t+.28);});}
  }catch(e){}
}

let particles=[],floatingTexts=[];
const fxCanvas=document.getElementById('fx-canvas');
const fxCtx=fxCanvas.getContext('2d');
function getCfg(l){
  if(l<=2)return{count:8,speed:2.5,size:5,life:35,icons:['✨','⭐'],colors:['#88cc44','#44aa22']};
  if(l<=4)return{count:14,speed:3.5,size:7,life:45,icons:['🌿','✨','💫'],colors:['#66bb33','#ffcc00','#88dd44']};
  if(l<=6)return{count:20,speed:4.5,size:9,life:55,icons:['🌱','💥','⭐','✨'],colors:['#44aa22','#ffaa00','#88cc00','#33ccaa']};
  if(l<=8)return{count:28,speed:5.5,size:11,life:65,icons:['🎉','🌿','💥','🎊','✨'],colors:['#22aa44','#ffaa00','#00ccaa','#88cc00','#ffcc00']};
  return{count:40,speed:7,size:14,life:80,icons:['🎉','🎊','🌿','💥','🥦','⭐','🎆'],colors:['#00aa44','#ffaa00','#00ffaa','#88cc00','#ffcc00','#00aacc']};
}
function spawnParticles(x,y,level){
  const cfg=getCfg(level);
  for(let i=0;i<cfg.count;i++){
    const angle=Math.PI*2/cfg.count*i+Math.random()*.4,speed=cfg.speed*(.6+Math.random()*.8);
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-(level>5?2:1),life:cfg.life+Math.random()*20|0,maxLife:cfg.life+20,size:cfg.size*(.7+Math.random()*.6),icon:cfg.icons[Math.random()*cfg.icons.length|0],color:cfg.colors[Math.random()*cfg.colors.length|0],rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.3,useEmoji:level>=3});
  }
  const labels=['','','','好!','很好!','棒!','太棒!','超棒!!','绝了!!!','无敌!!!!','🥦传说!!!!!'];
  if(level>0)floatingTexts.push({x,y:y-10,vy:-1.6,life:55,maxLife:55,text:labels[Math.min(level,labels.length-1)],size:13+level*2,color:level>=9?'#22aa44':level>=6?'#66aa00':level>=3?'#887700':'#556600'});
}
function updateFX(){
  fxCtx.clearRect(0,0,fxCanvas.width,fxCanvas.height);
  const alive=[];
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.rot+=p.rotV;p.life--;if(p.life<=0)continue;const alpha=p.life/p.maxLife;fxCtx.save();fxCtx.globalAlpha=alpha;fxCtx.translate(p.x,p.y);fxCtx.rotate(p.rot);if(p.useEmoji){fxCtx.font=`${p.size*2}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;fxCtx.textAlign='center';fxCtx.textBaseline='middle';fxCtx.fillText(p.icon,0,0);}else{fxCtx.fillStyle=p.color;fxCtx.beginPath();fxCtx.arc(0,0,p.size*alpha*.8+1,0,Math.PI*2);fxCtx.fill();fxCtx.strokeStyle='#fff';fxCtx.lineWidth=1;fxCtx.beginPath();fxCtx.moveTo(-p.size*.6,0);fxCtx.lineTo(p.size*.6,0);fxCtx.moveTo(0,-p.size*.6);fxCtx.lineTo(0,p.size*.6);fxCtx.stroke();}fxCtx.restore();alive.push(p);}
  particles=alive;
  const aliveT=[];
  for(const t of floatingTexts){t.y+=t.vy;t.life--;if(t.life<=0)continue;const alpha=Math.min(1,t.life/(t.maxLife*.3));fxCtx.save();fxCtx.globalAlpha=alpha;fxCtx.font=`500 ${Math.round(t.size)}px var(--font-sans,sans-serif)`;fxCtx.textAlign='center';fxCtx.textBaseline='middle';fxCtx.fillStyle=t.color;fxCtx.fillText(t.text,t.x,t.y);fxCtx.restore();aliveT.push(t);}
  floatingTexts=aliveT;
}

const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');
const gameArea=document.getElementById('game-area');
const aimLine=document.getElementById('aim-line');
const overlay=document.getElementById('overlay');

function getVegs(){return ALL_VEG.slice(0,parseInt(document.getElementById('veg-count').value));}
function getHeight(){return parseInt(document.getElementById('game-height').value);}

function buildLegend(){
  const vs=getVegs();
  document.getElementById('legend-grid').innerHTML=vs.map((v,i)=>
    `<div class="leg-item"><span class="leg-emoji">${v.emoji}</span><div class="leg-info"><span class="leg-name">${v.n}</span><span class="leg-lv">第${i+1}级</span></div></div>`
  ).join('');
}
buildLegend();
document.getElementById('veg-count').onchange=buildLegend;

function startGame(){
  if(engine){Matter.Runner.stop(runner);Matter.Engine.clear(engine);}
  if(animFrame)cancelAnimationFrame(animFrame);
  score=0;bodies=[];mergeQueue=[];scheduledIds=new Set();particles=[];floatingTexts=[];
  gameOver=false;canDrop=true;vegs=getVegs();
  document.getElementById('score').textContent='0';
  overlay.style.display='none';resetEye();
  const h=getHeight(),w=300;
  canvas.width=w;canvas.height=h;fxCanvas.width=w;fxCanvas.height=h;
  gameArea.style.height=h+'px';dropX=w/2;
  engine=Matter.Engine.create({gravity:{y:1.5},positionIterations:10,velocityIterations:8});
  world=engine.world;runner=Matter.Runner.create({delta:1000/60});
  const wo={isStatic:true,friction:.3,restitution:.1,label:'wall'};
  Matter.Composite.add(world,[Matter.Bodies.rectangle(w/2,h+25,w+4,50,wo),Matter.Bodies.rectangle(-25,h/2,50,h*2,wo),Matter.Bodies.rectangle(w+25,h/2,50,h*2,wo)]);
  Matter.Events.on(engine,'collisionStart',handlePairs);
  Matter.Events.on(engine,'collisionActive',handlePairs);
  Matter.Runner.run(runner,engine);
  pickNext();currentIdx=nextIdx;pickNext();
  document.getElementById('next-veg').textContent=vegs[nextIdx].emoji;
  gameArea.addEventListener('mousemove',onMM);
  gameArea.addEventListener('click',onCK);
  gameArea.addEventListener('touchmove',onTM,{passive:false});
  gameArea.addEventListener('touchend',onTE);
  gameRunning=true;loop();
}

function pickNext(){const max=Math.min(vegs.length-1,Math.floor(vegs.length*.45));nextIdx=Math.floor(Math.random()*(max+1));}
function spawnBody(idx,x,y){const v=vegs[idx];const b=Matter.Bodies.circle(x,y,v.r,{restitution:.15,friction:.4,frictionAir:.01,density:.003,label:'veg',slop:.5});b.vegIdx=idx;b.born=Date.now();Matter.Composite.add(world,b);bodies.push(b);return b;}
function safeRemove(b){const i=bodies.indexOf(b);if(i===-1)return false;Matter.Composite.remove(world,b);bodies.splice(i,1);return true;}
function trySchedule(a,b){if(a.vegIdx!==b.vegIdx)return;const now=Date.now();if(now-a.born<COOLDOWN_MS||now-b.born<COOLDOWN_MS)return;if(scheduledIds.has(a.id)||scheduledIds.has(b.id))return;scheduledIds.add(a.id);scheduledIds.add(b.id);mergeQueue.push({a,b});}
function handlePairs(e){e.pairs.forEach(({bodyA,bodyB})=>{if(bodyA.label==='veg'&&bodyB.label==='veg')trySchedule(bodyA,bodyB);});}
function proxScan(){
  const now=Date.now();
  for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){
    const a=bodies[i],b=bodies[j];
    if(a.vegIdx!==b.vegIdx)continue;if(now-a.born<COOLDOWN_MS||now-b.born<COOLDOWN_MS)continue;if(scheduledIds.has(a.id)||scheduledIds.has(b.id))continue;
    const dx=a.position.x-b.position.x,dy=a.position.y-b.position.y;
    if(Math.sqrt(dx*dx+dy*dy)<=vegs[a.vegIdx].r+vegs[b.vegIdx].r+PROXIMITY_GAP){scheduledIds.add(a.id);scheduledIds.add(b.id);mergeQueue.push({a,b});}
  }
}
function processMerges(){
  while(mergeQueue.length){
    const{a,b}=mergeQueue.shift();scheduledIds.delete(a.id);scheduledIds.delete(b.id);
    if(!safeRemove(a)||!safeRemove(b))continue;
    const mx=(a.position.x+b.position.x)/2,my=(a.position.y+b.position.y)/2;
    const ni=a.vegIdx+1;score+=1;document.getElementById('score').textContent=score;
    spawnParticles(mx,my,Math.min(ni,ALL_VEG.length-1));playMerge(Math.min(ni,ALL_VEG.length-1));
    if(ni<vegs.length){const v=vegs[ni];spawnBody(ni,Math.max(v.r+1,Math.min(canvas.width-v.r-1,mx)),Math.max(v.r+1,Math.min(canvas.height-v.r-1,my)));}
  }
}

const DANGER_Y=50;let dangerFrames=0;
function drawVeg(b){const v=vegs[b.vegIdx];if(!v)return;ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);ctx.font=`${v.r*2}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=1;ctx.fillText(v.emoji,0,0);ctx.restore();}

function loop(){
  proxScan();processMerges();
  ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#f4fbf4';ctx.fillRect(0,0,canvas.width,canvas.height);
  let danger=false;
  bodies.forEach(b=>{if(!vegs[b.vegIdx])return;if(b.position.y-vegs[b.vegIdx].r<DANGER_Y)danger=true;drawVeg(b);});
  if(danger){dangerFrames++;ctx.fillStyle=`rgba(220,50,50,${Math.min(.15,dangerFrames*.001)})`;ctx.fillRect(0,0,canvas.width,DANGER_Y);if(dangerFrames>120){endGame();return;}}else dangerFrames=Math.max(0,dangerFrames-2);
  ctx.strokeStyle='rgba(200,80,80,.35)';ctx.setLineDash([5,4]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,DANGER_Y);ctx.lineTo(canvas.width,DANGER_Y);ctx.stroke();ctx.setLineDash([]);
  if(canDrop&&gameRunning&&!gameOver){const v=vegs[currentIdx];const cx=Math.max(v.r+1,Math.min(canvas.width-v.r-1,dropX));ctx.globalAlpha=.45;ctx.strokeStyle='#bbb';ctx.setLineDash([4,4]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,canvas.height);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;ctx.font=`${v.r*2}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(v.emoji,cx,v.r+4);}
  updateFX();animFrame=requestAnimationFrame(loop);
}

function onMM(e){if(!gameRunning||gameOver||eyeLocked)return;const rect=gameArea.getBoundingClientRect();dropX=e.clientX-rect.left;aimLine.style.left=dropX+'px';aimLine.style.height=canvas.height+'px';aimLine.style.display='block';}
function onCK(e){if(!gameRunning||gameOver||!canDrop||eyeLocked)return;drop(e.clientX-gameArea.getBoundingClientRect().left);}
function onTM(e){e.preventDefault();if(!gameRunning||gameOver||eyeLocked)return;const rect=gameArea.getBoundingClientRect();dropX=e.touches[0].clientX-rect.left;aimLine.style.left=dropX+'px';aimLine.style.display='block';}
function onTE(){if(!gameRunning||gameOver||!canDrop||eyeLocked)return;drop(dropX);}
function drop(x){const v=vegs[currentIdx];spawnBody(currentIdx,Math.max(v.r+1,Math.min(canvas.width-v.r-1,x)),v.r+2);canDrop=false;currentIdx=nextIdx;pickNext();document.getElementById('next-veg').textContent=vegs[nextIdx].emoji;setTimeout(()=>{if(!gameOver)canDrop=true;},480);}
function endGame(){gameOver=true;gameRunning=false;canDrop=false;Matter.Runner.stop(runner);cancelAnimationFrame(animFrame);aimLine.style.display='none';for(let i=0;i<4;i++)setTimeout(()=>spawnParticles(80+Math.random()*140,100+Math.random()*120,9),i*120);overlay.innerHTML=`<h2>游戏结束 🥦</h2><p>最终得分：${score} 分</p><button onclick="startGame()">再来一局</button>`;overlay.style.display='flex';}

let eyeLocked=false,eyeTotal=300,eyeElapsed=0,eyeTickID=null,restLeft=60,restTickID=null;
const eyeOverlay=document.getElementById('eye-overlay');
const eyeFill=document.getElementById('eye-fill');
const eyeLbl=document.getElementById('eye-lbl');
const eyeCd=document.getElementById('eye-cd');
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function resetEye(){
  clearInterval(eyeTickID);clearInterval(restTickID);
  eyeLocked=false;eyeElapsed=0;eyeTotal=parseInt(document.getElementById('eye-setting').value);
  eyeFill.style.width='100%';eyeLbl.textContent=fmt(eyeTotal);eyeOverlay.style.display='none';
  eyeTickID=setInterval(()=>{if(eyeLocked)return;eyeElapsed++;const rem=eyeTotal-eyeElapsed;eyeLbl.textContent=fmt(Math.max(0,rem));eyeFill.style.width=(rem/eyeTotal*100)+'%';if(rem<=0)lockEye();},1000);
}
function lockEye(){
  clearInterval(eyeTickID);eyeLocked=true;
  if(gameRunning&&!gameOver){Matter.Runner.stop(runner);cancelAnimationFrame(animFrame);}
  aimLine.style.display='none';restLeft=60;eyeCd.textContent=restLeft;eyeOverlay.style.display='flex';
  restTickID=setInterval(()=>{restLeft--;eyeCd.textContent=restLeft;if(restLeft<=0){clearInterval(restTickID);eyeOverlay.style.display='none';eyeLocked=false;eyeElapsed=0;eyeTotal=parseInt(document.getElementById('eye-setting').value);eyeFill.style.width='100%';eyeLbl.textContent=fmt(eyeTotal);resetEye();if(gameRunning&&!gameOver){Matter.Runner.run(runner,engine);loop();}}},1000);
}
document.getElementById('eye-setting').onchange=()=>{if(!eyeLocked)resetEye();};
window.startGame=startGame;
startGame();
</script>
